<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>292 Bet - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.header{
  background:linear-gradient(135deg,#212121,#000);
  color:#fff;
  padding:22px 15px;
  text-align:center;
}

.header h1{
  margin:0 0 6px;
  font-size:25px;
}

.header p{
  margin:0;
  font-size:13px;
  opacity:.8;
}

.container{
  max-width:700px;
  margin:18px auto;
  padding:0 12px 35px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
}

h2{
  font-size:19px;
  margin:0 0 14px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.summary-box{
  background:#f5f7fa;
  border-radius:12px;
  padding:14px 8px;
  text-align:center;
}

.summary-box strong{
  display:block;
  font-size:24px;
  margin-top:5px;
}

.pending-number{color:#f57c00}
.approved-number{color:#198754}
.rejected-number{color:#dc3545}

.request{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  line-height:1.7;
  background:#fafbfc;
}

.request b{
  color:#333;
}

.status{
  font-weight:bold;
}

.pending{
  color:#f57c00;
}

.approved{
  color:#198754;
}

.rejected{
  color:#dc3545;
}

.processing{
  color:#f57c00;
}

button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:9px;
  color:#fff;
  font-size:15px;
  cursor:pointer;
  margin-top:8px;
}

.approve{
  background:#198754;
}

.reject{
  background:#dc3545;
}

.refresh{
  background:#1976d2;
}

.logout{
  background:#343a40;
}

button:disabled{
  opacity:.55;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-top:10px;
  line-height:1.5;
  font-size:14px;
}

.success{
  display:block;
  background:#e9f8ef;
  color:#176b3a;
}

.error{
  display:block;
  background:#ffebee;
  color:#b71c1c;
}

.login-card{
  max-width:430px;
  margin:50px auto;
  padding:20px;
}

.hidden{
  display:none;
}

.email{
  word-break:break-all;
  font-size:13px;
  opacity:.85;
}

@media(max-width:500px){
  .summary{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>292 Bet — Admin Panel</h1>
  <p id="adminEmail">Checking Admin...</p>
</header>

<main class="container">

  <!-- SUMMARY -->

  <section class="card">
    <h2>📊 Request Summary</h2>

    <div class="summary">

      <div class="summary-box">
        Pending
        <strong id="pendingCount" class="pending-number">
          0
        </strong>
      </div>

      <div class="summary-box">
        Approved
        <strong id="approvedCount" class="approved-number">
          0
        </strong>
      </div>

      <div class="summary-box">
        Rejected
        <strong id="rejectedCount" class="rejected-number">
          0
        </strong>
      </div>

    </div>

    <button
      class="refresh"
      onclick="loadDepositRequests()">
      🔄 Refresh Requests
    </button>

  </section>


  <!-- DEPOSIT REQUESTS -->

  <section class="card">

    <h2>💳 Deposit Requests</h2>

    <div id="depositRequests">
      Loading...
    </div>

  </section>


  <!-- WITHDRAW REQUESTS -->

  <section class="card">

    <h2>💸 Withdraw Requests</h2>

    <div id="withdrawRequests">
      Loading...
    </div>

  </section>


  <button
    class="logout"
    onclick="logout()">
    🚪 Admin Logout
  </button>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  increment,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAItXQ5rE7MVpui3tazPxXN4F6sQGZ--ok",

  authDomain:
    "bet-e114b.firebaseapp.com",

  projectId:
    "bet-e114b",

  storageBucket:
    "bet-e114b.firebasestorage.app",

  messagingSenderId:
    "464681620003",

  appId:
    "1:464681620003:web:3169096c02b1d9ce3c5796"

};


/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UID =
  "0J0TIrsSBjg6XEr0tyIl3oczWyS2";


/* =========================================
   INITIALIZE
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      document.body.innerHTML = `
        <div class="card login-card">
          <h2>🔐 Admin Login Required</h2>
          <p>Admin Panel ব্যবহার করার আগে আপনার Admin account দিয়ে Login করুন।</p>
          <button class="refresh"
            onclick="location.href='./index.html'">
            Login Page
          </button>
        </div>
      `;

      return;
    }


    /* ADMIN UID CHECK */

    if (user.uid !== ADMIN_UID) {

      document.body.innerHTML = `
        <div class="card login-card">
          <h2>⛔ Access Denied</h2>
          <p>
            এই account-এর Admin Panel ব্যবহারের অনুমতি নেই।
          </p>
          <button class="logout"
            onclick="logout()">
            Logout
          </button>
        </div>
      `;

      await signOut(auth);

      return;
    }


    /* ADMIN VERIFIED */

    document.getElementById(
      "adminEmail"
    ).textContent =
      "Admin: " + user.email;


    loadDepositRequests();

    loadWithdrawRequests();

  }
);


/* =========================================
   LOAD DEPOSIT REQUESTS
========================================= */

window.loadDepositRequests =
async function(){

  const box =
    document.getElementById(
      "depositRequests"
    );

  box.innerHTML =
    "Loading...";


  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "depositRequests"
        )
      );


    let pending = 0;
    let approved = 0;
    let rejected = 0;


    box.innerHTML = "";


    if(snapshot.empty){

      box.innerHTML =
        "কোনো Deposit Request নেই।";

    }


    snapshot.forEach(
      item => {

        const data =
          item.data();

        const id =
          item.id;

        const status =
          data.status || "pending";


        if(status === "pending")
          pending++;

        if(status === "approved")
          approved++;

        if(status === "rejected")
          rejected++;


        const div =
          document.createElement(
            "div"
          );

        div.className =
          "request";


        div.innerHTML = `

          <b>👤 User Email:</b>
          ${escapeHtml(data.userEmail || "N/A")}
          <br>

          <b>💰 Amount:</b>
          ৳${Number(data.amount || 0).toFixed(2)}
          <br>

          <b>🧾 Transaction ID:</b>
          ${escapeHtml(data.transactionId || "N/A")}
          <br>

          <b>📌 Status:</b>
          <span class="status ${escapeHtml(status)}">
            ${escapeHtml(status)}
          </span>

        `;


        if(status === "pending"){

          const approve =
            document.createElement(
              "button"
            );

          approve.className =
            "approve";

          approve.textContent =
            "✅ Approve & Add Balance";

          approve.onclick =
            () =>
              approveDeposit(
                id,
                data.userId,
                Number(data.amount || 0)
              );


          const reject =
            document.createElement(
              "button"
            );

          reject.className =
            "reject";

          reject.textContent =
            "❌ Reject";

          reject.onclick =
            () =>
              rejectDeposit(id);


          div.appendChild(
            approve
          );

          div.appendChild(
            reject
          );

        }


        box.appendChild(div);

      }
    );


    document.getElementById(
      "pendingCount"
    ).textContent =
      pending;

    document.getElementById(
      "approvedCount"
    ).textContent =
      approved;

    document.getElementById(
      "rejectedCount"
    ).textContent =
      rejected;


  } catch(error){

    console.error(error);

    box.innerHTML =
      "❌ Request load করা যায়নি। Firebase Rules পরীক্ষা করুন।";

  }

};


/* =========================================
   APPROVE DEPOSIT
========================================= */

async function approveDeposit(
  requestId,
  userId,
  amount
){

  if(!confirm(
    "এই Deposit Approve করলে ৳" +
    amount +
    " User-এর Balance-এ যোগ হবে।\n\nContinue?"
  )){
    return;
  }


  try {


    /* USER DOCUMENT */

    const userRef =
      doc(
        db,
        "users",
        userId
      );


    const userSnap =
      await getDoc(
        userRef
      );


    if(!userSnap.exists()){

      alert(
        "❌ User account পাওয়া যায়নি।"
      );

      return;
    }


    /* ADD BALANCE */

    await updateDoc(
      userRef,
      {
        balance:
          increment(amount)
      }
    );


    /* UPDATE REQUEST */

    await updateDoc(
      doc(
        db,
        "depositRequests",
        requestId
      ),
      {
        status:
          "approved",

        approvedAt:
          serverTimestamp(),

        approvedBy:
          auth.currentUser.uid
      }
    );


    alert(
      "✅ Deposit Approved!\n\n" +
      "৳" +
      amount +
      " User-এর Balance-এ যোগ হয়েছে।"
    );


    loadDepositRequests();


  } catch(error){

    console.error(error);

    alert(
      "❌ Approve করা যায়নি।\n\n" +
      "Firebase Firestore Rules পরীক্ষা করুন।"
    );

  }

}


/* =========================================
   REJECT DEPOSIT
========================================= */

async function rejectDeposit(
  requestId
){

  if(!confirm(
    "এই Deposit Request Reject করবেন?"
  )){
    return;
  }


  try {

    await updateDoc(

      doc(
        db,
        "depositRequests",
        requestId
      ),

      {
        status:
          "rejected",

        rejectedAt:
          serverTimestamp(),

        rejectedBy:
          auth.currentUser.uid
      }

    );


    alert(
      "❌ Deposit Request Rejected."
    );


    loadDepositRequests();


  } catch(error){

    console.error(error);

    alert(
      "❌ Reject করা যায়নি।"
    );

  }

}


/* =========================================
   LOAD WITHDRAW REQUESTS
========================================= */

async function loadWithdrawRequests(){

  const box =
    document.getElementById(
      "withdrawRequests"
    );


  box.innerHTML =
    "Loading...";


  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "withdrawRequests"
        )
      );


    box.innerHTML = "";


    if(snapshot.empty){

      box.innerHTML =
        "কোনো Withdraw Request নেই।";

      return;

    }


    snapshot.forEach(
      item => {

        const data =
          item.data();

        const id =
          item.id;

        const status =
          data.status || "pending";


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "request";


        div.innerHTML = `

          <b>👤 User:</b>
          ${escapeHtml(data.userEmail || "N/A")}
          <br>

          <b>💰 Amount:</b>
          ৳${Number(data.amount || 0).toFixed(2)}
          <br>

          <b>💳 Method:</b>
          ${escapeHtml(data.method || "N/A")}
          <br>

          <b>📱 Number:</b>
          ${escapeHtml(data.number || "N/A")}
          <br>

          <b>📌 Status:</b>
          <span class="status ${escapeHtml(status)}">
            ${escapeHtml(status)}
          </span>

        `;


        box.appendChild(
          div
        );

      }
    );


  } catch(error){

    console.error(error);

    box.innerHTML =
      "❌ Withdraw Request load করা যায়নি।";

  }

}


/* =========================================
   LOGOUT
========================================= */

window.logout =
async function(){

  await signOut(auth);

  location.href =
    "./index.html";

};


/* =========================================
   HTML SECURITY
========================================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>'"]/g,
      char => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"

      }[char])
    );

}

</script>

</body>
</html>
