<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>292 Bet - Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

.header {
    background: #1976d2;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #d32f2f;
    color: white;
    font-size: 16px;
}

#loading {
    text-align: center;
    margin-top: 50px;
}
</style>
</head>

<body>

<div id="loading">
    Checking login...
</div>

<div id="dashboard" style="display:none;">

    <div class="header">
        <h1>292 Bet</h1>
        <p>Member Dashboard</p>
    </div>

    <div class="container">

        <h2>Welcome 🎉</h2>

        <p id="userEmail"></p>

        <p>
            You are successfully logged in.
        </p>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyAItXQ5rE7MVpui3tazPxXN4F6sQGZ--ok",

    authDomain:
    "bet-e114b.firebaseapp.com",

    projectId:
    "bet-e114b",

    storageBucket:
    "bet-e114b.firebasestorage.app",

    messagingSenderId:
    "464681620003",

    appId:
    "1:464681620003:web:3169096c02b1d9ce3c5796",

    measurementId:
    "G-NDVCWNKV8B"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


onAuthStateChanged(auth, (user) => {

    if (user) {

        // User is logged in
        document.getElementById("loading").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

        document.getElementById("userEmail").innerText =
            "Logged in as: " + user.email;

    } else {

        // User is NOT logged in
        window.location.href =
            "./index.html";

    }

});


document.getElementById("logoutBtn").addEventListener(
    "click",
    async () => {

        await signOut(auth);

        window.location.href =
            "./index.html";

    }
);

</script>

</body>
</html>
