<!DOCTYPE html> <html lang="bn"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>292 Bet - Login</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #1976d2, #0d47a1); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; } .container { width: 100%; max-width: 420px; } .card { background: #ffffff; border-radius: 18px; padding: 28px 22px; box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2); } .logo { text-align: center; font-size: 32px; font-weight: bold; color: #0d47a1; margin-bottom: 5px; } .subtitle { text-align: center; color: #777; font-size: 14px; margin-bottom: 25px; } h2 { text-align: center; margin: 0 0 20px; color: #172033; } input { width: 100%; padding: 14px; margin: 7px 0; border: 1px solid #d8dee8; border-radius: 9px; font-size: 15px; outline: none; } input:focus { border-color: #1976d2; } button { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 9px; background: #1976d2; color: white; font-size: 16px; cursor: pointer; } button:hover { background: #0d47a1; } button:disabled { opacity: 0.6; cursor: not-allowed; } .signup-btn { background: #198754; } .signup-btn:hover { background: #146c43; } .message { display: none; margin-top: 15px; padding: 12px; border-radius: 9px; text-align: center; line-height: 1.5; font-size: 14px; } .success { display: block; background: #e8f5e9; color: #176b3a; } .error { display: block; background: #ffebee; color: #b71c1c; } .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; color: #999; font-size: 13px; } .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #ddd; } .footer { text-align: center; margin-top: 18px; color: #888; font-size: 12px; } @media (max-width: 420px) { .card { padding: 24px 17px; } } </style> </head> <body> <div class="container"> <div class="card"> <div class="logo">292 Bet</div> <div class="subtitle"> Member Login & Registration </div> <h2>🔐 Login</h2> <input id="email" type="email" placeholder="Email Address" autocomplete="email" > <input id="password" type="password" placeholder="Password" autocomplete="current-password" > <button id="loginButton" onclick="login()"> Login </button> <div class="divider"> অথবা </div> <button class="signup-btn" id="signupButton" onclick="signup()"> নতুন Account তৈরি করুন </button> <div id="message" class="message"> </div> <div class="footer"> © 2026 292 Bet </div> </div> </div> <script type="module"> /* ================================ FIREBASE IMPORT ================================= */ import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; /* ================================ FIREBASE CONFIG ================================= */ const firebaseConfig = { apiKey: "AIzaSyAItXQ5rE7MVpui3tazPxXN4F6sQGZ--ok", authDomain: "bet-e114b.firebaseapp.com", projectId: "bet-e114b", storageBucket: "bet-e114b.firebasestorage.app", messagingSenderId: "464681620003", appId: "1:464681620003:web:3169096c02b1d9ce3c5796", measurementId: "G-NDVCWNKV8B" }; /* ================================ INITIALIZE FIREBASE ================================= */ const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); let processing = false; /* ================================ MESSAGE FUNCTION ================================= */ function showMessage(text, type) { const message = document.getElementById("message"); message.className = "message " + type; message.innerHTML = text; } /* ================================ LOGIN ================================= */ window.login = async function () { if (processing) return; const email = document .getElementById("email") .value .trim(); const password = document .getElementById("password") .value; if (!email) { showMessage( "❌ Email লিখুন।", "error" ); return; } if (!password) { showMessage( "❌ Password লিখুন।", "error" ); return; } processing = true; const button = document.getElementById( "loginButton" ); button.disabled = true; button.innerText = "Login হচ্ছে..."; try { await signInWithEmailAndPassword( auth, email, password ); showMessage( "✅ Login সফল হয়েছে। Dashboard-এ নেওয়া হচ্ছে...", "success" ); setTimeout(() => { window.location.href = "./dashboard.html"; }, 700); } catch (error) { console.error(error); let text = "❌ Login করা যায়নি।"; if ( error.code === "auth/invalid-credential" ) { text = "❌ Email অথবা Password ভুল।"; } else if ( error.code === "auth/user-not-found" ) { text = "❌ এই Email দিয়ে কোনো Account নেই।"; } else if ( error.code === "auth/wrong-password" ) { text = "❌ Password ভুল।"; } else if ( error.code === "auth/invalid-email" ) { text = "❌ সঠিক Email Address দিন।"; } showMessage( text, "error" ); } finally { processing = false; button.disabled = false; button.innerText = "Login"; } }; /* ================================ SIGN UP ================================= */ window.signup = async function () { if (processing) return; const email = document .getElementById("email") .value .trim(); const password = document .getElementById("password") .value; if (!email) { showMessage( "❌ Account তৈরি করতে Email লিখুন।", "error" ); return; } if (!password) { showMessage( "❌ Password লিখুন।", "error" ); return; } if (password.length < 6) { showMessage( "❌ Password কমপক্ষে 6 অক্ষরের হতে হবে।", "error" ); return; } processing = true; const button = document.getElementById( "signupButton" ); button.disabled = true; button.innerText = "Account তৈরি হচ্ছে..."; try { const userCredential = await createUserWithEmailAndPassword( auth, email, password ); const user = userCredential.user; /* ================================ CREATE USER DOCUMENT ================================= */ await setDoc( doc( db, "users", user.uid ), { email: user.email, balance: 0, status: "active", createdAt: serverTimestamp() } ); showMessage( "✅ Account সফলভাবে তৈরি হয়েছে। Dashboard-এ নেওয়া হচ্ছে...", "success" ); setTimeout(() => { window.location.href = "./dashboard.html"; }, 1000); } catch (error) { console.error(error); let text = "❌ Account তৈরি করা যায়নি।"; if ( error.code === "auth/email-already-in-use" ) { text = "❌ এই Email দিয়ে ইতিমধ্যে Account আছে। Login করুন।"; } else if ( error.code === "auth/invalid-email" ) { text = "❌ সঠিক Email Address দিন।"; } else if ( error.code === "auth/weak-password" ) { text = "❌ Password আরও শক্তিশালী দিন।"; } showMessage( text, "error" ); } finally { processing = false; button.disabled = false; button.innerText = "নতুন Account তৈরি করুন"; } }; /* ================================ ALREADY LOGGED IN ================================= */ onAuthStateChanged( auth, (user) => { if (user) { window.location.href = "./dashboard.html"; } } ); /* ================================ ENTER KEY LOGIN ================================= */ document .getElementById("password") .addEventListener( "keydown", (event) => { if ( event.key === "Enter" ) { login(); } } ); </script> </body> </html>
